nting - I chose to print mine on its back, but you may also have a figure you can print best \u2026","image":"https://content.instructables.com/F1T/W8GU/MG8A1MQS/F1TW8GUMG8A1MQS.png?auto=webp&fit=bounds&frame=1&height=1024&width=1024","url":"https://www.instructables.com/Custom-Tonie-Audio-Figure/#step4"},{"@type":"HowToStep","name":"Paint Your Figure and Add Its Music","text":"You can now decorate your figure as much as you would like - in my case we sanded it down with a few grades of sandpaper, painted it and sprayed on some varnish to protect the paint from coming off.\nWith that done its time to add whatever music you \u2026","image":"https://content.instructables.com/FR3/PSIH/MG8A1PMK/FR3PSIHMG8A1PMK.png?auto=webp&fit=bounds&frame=1&height=1024&width=1024","url":"https://www.instructables.com/Custom-Tonie-Audio-Figure/#step5"}]}</script><link href="/assets/css/artifakt.css?c=3a73e1d793" rel="stylesheet" type="text/css" /><link href="/assets/css/common_theme.css?c=3a73e1d793" rel="stylesheet" type="text/css" media="screen" /><link href="/assets/css/theme.css?c=3a73e1d793" rel="stylesheet" type="text/css" media="screen" /><link href="/assets/css/global.css?c=3a73e1d793" rel="stylesheet" type="text/css" media="screen" /><link rel="preload" href="/assets/fonts/artifakt-element-regular.woff2" as="font" type="font/woff2" crossorigin="anonymous"><link rel="preload" href="/assets/fonts/artifakt-element-medium.woff2" as="font" type="font/woff2" crossorigin="anonymous"><link rel="preload" href="/assets/fonts/artifakt-element-bold.woff2" as="font" type="font/woff2" crossorigin="anonymous"><link rel="preload" href="/assets/fonts/artifakt-legend-regular.woff2" as="font" type="font/woff2" crossorigin="anonymous"><link rel="preload" href="/assets/fonts/artifakt-legend-bold.woff2" as="font" type="font/woff2" crossorigin="anonymous"><link rel="stylesheet" href="/assets/js_bundles/bcf92c22a0/Icons-DNZgkoOz.css" /><link rel="stylesheet" href="/assets/js_bundles/bcf92c22a0/main-C
